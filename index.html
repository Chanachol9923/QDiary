<!doctype html>
<html lang="en" data-ui="pixel" data-desk="checker">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>QDiary</title>
  <meta name="description" content="A cozy pixel-art diary: write, draw, stick photos and voice notes.">
  <meta name="theme-color" content="#ffeef3">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="QDiary">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400..700&family=Nunito:wght@400;600;700;800&family=Mali:wght@400;600&family=Itim&family=Sriracha&family=Patrick+Hand&family=Caveat:wght@400..700&family=Gaegu:wght@400;700&family=Klee+One:wght@400;600&family=DotGothic16&family=Noto+Sans:wght@400;700&family=Noto+Serif:wght@400;700&family=Noto+Sans+Thai:wght@400;700&family=Noto+Sans+JP:wght@400;700&family=Noto+Sans+KR:wght@400;700&family=Noto+Sans+SC:wght@400;700&family=Noto+Sans+Arabic:wght@400;700&display=swap">
  <script>
    // apply the saved theme before first paint (no flash)
    try {
      var b = JSON.parse(localStorage.getItem('qd.boot'));
      if (b) {
        var r = document.documentElement;
        for (var k in b.vars) r.style.setProperty(k, b.vars[k]);
        for (var a in b.attrs) r.dataset[a] = b.attrs[a];
      }
    } catch (e) {}
  </script>
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <header class="mobile-bar">
    <button id="menu-btn" class="icon-btn bx" aria-label="Open menu"></button>
    <span id="mobile-brand" class="mobile-brand"></span>
  </header>
  <div id="app">
    <aside id="sidebar" class="sidebar" aria-label="Sidebar"></aside>
    <main id="main" class="main"></main>
  </div>
  <div id="scrim" class="scrim"></div>
  <div id="modal-root"></div>
  <div id="toast-root" aria-live="polite"></div>

  <script src="js/util.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/store.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/media.js"></script>
  <script src="js/journal.js"></script>
  <script src="js/views.js"></script>
  <script src="js/transfer.js"></script>
  <script src="js/settings.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
